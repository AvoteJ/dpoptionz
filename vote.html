<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
    <title>Double Play Optionz - Vote</title>
    <style>
        body { background-color: #333333; color: white; font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }

        main { flex: 1; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 30px; }

        /* 곡 정보 테이블 - table.html과 동일 스타일 */
        table { border-collapse: collapse; width: 95%; max-width: 1200px; background-color: rgba(255,255,255,0.05); }
        th { background-color: #5c3333; padding: 12px; border: 1px solid #555; font-size: 11pt; }
        td { padding: 10px; border: 1px solid #555; font-size: 10pt; text-align: center; }
        th:nth-child(2), td:nth-child(2) { width: 1%; white-space: nowrap; }   /* Diff. */
        th:nth-child(3), td:nth-child(3) { width: 1%; white-space: nowrap; }   /* Lv */
        th:nth-child(4), td:nth-child(4) { width: 1%; white-space: nowrap; }   /* Lv.x */

        /* 투표 폼 */
        .vote-form {
            width: 95%;
            max-width: 1200px;
            background-color: rgba(255,255,255,0.05);
            border: 1px solid #555;
            padding: 30px;
            box-sizing: border-box;
        }
        .vote-form h2 {
            margin: 0 0 24px 0;
            font-size: 14pt;
            font-weight: normal;
            color: rgba(255,255,255,0.9);
            border-bottom: 1px solid #555;
            padding-bottom: 12px;
        }
        .vote-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
        }
        .vote-label {
            width: 100px;
            font-size: 10pt;
            color: rgba(255,255,255,0.7);
            text-align: right;
            flex-shrink: 0;
        }
        .vote-select {
            flex: 1;
            max-width: 300px;
            padding: 8px 12px;
            background-color: #444;
            border: 1px solid #555;
            color: white;
            font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Arial, sans-serif;
            font-size: 10pt;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }
        .vote-select:focus { border-color: rgba(255,255,255,0.5); }

        .submit-btn {
            display: block;
            margin: 30px auto 0;
            padding: 10px 40px;
            background-color: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            color: rgba(255,255,255,0.8);
            font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Arial, sans-serif;
            font-size: 11pt;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-btn:hover { background-color: rgba(255,255,255,0.1); }
        .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 결과 메시지 */
        .result-msg {
            display: none;
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 10pt;
            text-align: center;
        }
        .result-msg.success { background-color: rgba(80,160,80,0.3); border: 1px solid rgba(80,160,80,0.6); }
        .result-msg.error   { background-color: rgba(160,60,60,0.3); border: 1px solid rgba(160,60,60,0.6); }

        .not-found { color: rgba(255,255,255,0.5); font-size: 11pt; margin-top: 60px; }

        .vote-textarea {
            width: 100%;
            min-height: 70px;
            padding: 8px 12px;
            background-color: #444;
            border: 1px solid #555;
            color: white;
            font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Arial, sans-serif;
            font-size: 10pt;
            border-radius: 4px;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
        }
        .vote-textarea:focus { border-color: rgba(255,255,255,0.5); }
        .vote-textarea::placeholder { color: rgba(255,255,255,0.2); }

        /* ── 공통 배너 ── */
        #site-banner {
            width: 100%;
            background-color: rgba(40, 30, 10, 0.55);
            padding: 10px 0;
            font-size: 10.5pt;
            color: rgba(255, 200, 100, 0.85);
            box-sizing: border-box;
        }

        /* ── 공통 네비게이션 ── */
        header { width: 100%; padding: 20px 0; }
        .nav-container { display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; width: 100%; padding: 0 20px; box-sizing: border-box; position: relative; }
        .nav-link {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14pt;
            font-family: inherit;
        }
        .nav-link:hover { background-color: rgba(255, 255, 255, 0.08); }
        .nav-link-active {
            background-color: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.85);
            color: white;
        }

        /* ── 오른쪽 상단 Login / Logout 버튼 ── */
        .auth-corner-btn {
            padding: 7px 16px;
            border-radius: 4px;
            font-size: 11pt;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .auth-corner-btn.logout {
            background-color: transparent;
            border: 1px solid rgba(255, 100, 100, 0.55);
            color: rgba(255, 130, 130, 0.9);
        }
        .auth-corner-btn.logout:hover { background-color: rgba(255, 80, 80, 0.15); }
        .auth-corner-btn.login {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.75);
        }
        .auth-corner-btn.login:hover { background-color: rgba(255, 255, 255, 0.1); }

        /* ── 모달 모드: 배너/네비/로그아웃 숨김 ── */
        body.modal-mode #site-banner,
        body.modal-mode #site-nav,
        body.modal-mode header,
        body.modal-mode #auth-btn-container { display: none !important; }
        body.modal-mode main { padding-top: 20px; }
    </style>
</head>
<body>
    <div id="site-banner"></div>

    <header>
        <nav class="nav-container" id="site-nav"></nav>
        <div id="how2use-link" style="text-align:center; padding: 4px 0 2px;"></div>
    </header>
    <main id="main-content">
        <!-- JS로 동적 생성 -->
    </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
    if (new URLSearchParams(location.search).get('modal') === '1') {
        document.body.classList.add('modal-mode');
    }
</script>
<script src="config.js"></script>
<script src="session.js"></script>
<script src="nav.js"></script>
<script>
    // 로그인 세션 확인 → 없으면 login.html로 이동 후 실행 중단
    (function() {
        const s = checkSession();
        // 경고창: 로그인 상태에서만 표시
        const _warn = document.getElementById('vote-warning');
        if (_warn) _warn.style.display = s ? 'block' : 'none';
        if (!s) {
            sessionStorage.setItem('dpopz_returnTo', location.href);
            location.href = 'login.html';
            throw new Error('redirect to login');
        }
    })();

    const params = new URLSearchParams(location.search);
    const title = params.get('title');
    const main = document.getElementById('main-content');

    if (!title) {
        main.innerHTML = '<p class="not-found">No song information found. <a href="table.html" style="color:rgba(255,255,255,0.6)">Back to Table</a></p>';
    } else {
        // DPOPz DATABASE.xlsx Sheet3(Lv.x) + Apps Script 병렬 로드
        let lvxIndex = {};
        function getLvx(title, diff) {
            const diffMap = { 'ANOTHER': 'A', 'LEGGENDARIA': 'L', 'HYPER': 'H' };
            const code = diffMap[diff] || diff.charAt(0).toUpperCase();
            return lvxIndex[`${title}|${code}`] || '';
        }

        fetch('DPOPz_DATABASE.xlsx').then(r => r.arrayBuffer())
        .then(xlsxBuffer => {
            const wb = XLSX.read(xlsxBuffer, { type: 'array' });

            // Sheet3: Lv.x 인덱스
            const ws3 = wb.Sheets[wb.SheetNames[2]];
            XLSX.utils.sheet_to_json(ws3, { header: 1 }).forEach(r => {
                const lvx   = String(r[0] ?? '').trim();
                const entry = String(r[1] ?? '').trim();
                const m = entry.match(/^(.+?)\s*\[([ALH])\]$/);
                if (m && lvx && !isNaN(parseFloat(lvx))) {
                    lvxIndex[`${m[1].trim()}|${m[2]}`] = lvx;
                }
            });

            // Sheet1: 옵션 분포 인덱스 구성 (Timestamp=OFF 제외)
            const ws1 = wb.Sheets[wb.SheetNames[0]];
            const s1rows = XLSX.utils.sheet_to_json(ws1, { header: 1 }).slice(1);

            // 최신 타임스탬프 추출
            const tsPattern = /^\d{4}\.\s*\d{2}\.\s*\d{2}\.\s*\d{2}:\d{2}:\d{2}$/;
            let latestTs = '';
            s1rows.forEach(r => {
                const ts = String(r[0] ?? '').trim();
                if (tsPattern.test(ts) && ts > latestTs) latestTs = ts;
            });
            if (latestTs) window.dpopzLastVote = latestTs;

            const distribMap = {};
            s1rows
                .filter(r => String(r[0] ?? '').toUpperCase() !== 'OFF')
                .forEach(r => {
                    const t    = String(r[1] ?? '').trim();
                    const d    = String(r[2] ?? '').trim();
                    const opt1 = String(r[3] ?? '').trim() || 'OFF';
                    const opt2 = String(r[4] ?? '').trim() || 'OFF';
                    const opt3 = String(r[5] ?? '').trim() || 'OFF';
                    if (!t || !d) return;
                    const key   = `${t}|${d}`;
                    const combo = `${opt1}|${opt2}|${opt3}`;
                    if (!distribMap[key]) distribMap[key] = {};
                    distribMap[key][combo] = (distribMap[key][combo] || 0) + 1;
                });

            const optionDistrib = {};
            // noteMap: 투표 코멘트 수집
            window._voteNoteMap = {};
            s1rows.forEach(r => {
                const _t = String(r[1] ?? '').trim();
                const _d = String(r[2] ?? '').trim();
                const _o1 = String(r[3] ?? '').trim() || 'OFF';
                const _o2 = String(r[4] ?? '').trim() || 'OFF';
                const _o3 = String(r[5] ?? '').trim() || 'OFF';
                const _n  = String(r[6] ?? '').trim();
                const _u  = String(r[7] ?? '').trim();
                if (!_n || !_u || !_t || !_d) return;
                const _k = `${_t}|${_d}`;
                if (!window._voteNoteMap[_k]) window._voteNoteMap[_k] = [];
                window._voteNoteMap[_k].push({ opt1:_o1, opt2:_o2, opt3:_o3, note:_n, uid:_u });
            });

            Object.entries(distribMap).forEach(([key, combos]) => {
                const total = Object.values(combos).reduce((a, b) => a + b, 0);
                optionDistrib[key] = Object.entries(combos)
                    .sort((a, b) => b[1] - a[1])
                    .map(([combo, count]) => {
                        const [o1, o2, o3] = combo.split('|');
                        return { opt1: o1, opt2: o2, opt3: o3, count, pct: Math.round(count / total * 1000) / 10 };
                    });
            });

            function optColor(val) {
                if (val === 'OFF')                          return '#808080';
                if (val === 'MIRROR')                       return 'rgba(150,220,150,1)';
                if (val === 'RANDOM' || val === 'R-RANDOM') return '#FFA500';
                if (val === 'S-RANDOM')                     return 'rgba(255,60,60,0.75)';
                return 'rgba(255,255,255,0.9)';
            }

            function makeOptionSpan(opt1, opt2, opt3) {
                const span = document.createElement('span');
                const parts = [];
                if (opt1 !== 'OFF') { parts.push({ val: opt1 }); parts.push({ val: ', ', plain: true }); }
                parts.push({ val: opt2 });
                parts.push({ val: '/', plain: true });
                parts.push({ val: opt3 });
                parts.forEach(p => {
                    if (p.plain) { span.appendChild(document.createTextNode(p.val)); }
                    else { const s = document.createElement('span'); s.textContent = p.val; s.style.color = optColor(p.val); span.appendChild(s); }
                });
                return span;
            }

            // Sheet2: 배치표에서 곡 정보 조회 (URL의 title + diff 파라미터로 매칭)
            const urlDiff = params.get('diff') || '';
            const ws2  = wb.Sheets[wb.SheetNames[1]];
            const sheet2Rows = XLSX.utils.sheet_to_json(ws2, { header: 1 }).slice(1)
                .filter(r => r[0] && String(r[0]).toUpperCase() !== 'OFF');

            // title 일치하는 행 전체 수집 (diff 파라미터 있으면 추가 필터)
            let matched = sheet2Rows.filter(r => String(r[2] ?? '').trim() === title);
            if (urlDiff && matched.length > 1) {
                const filtered = matched.filter(r => String(r[3] ?? '').trim() === urlDiff);
                if (filtered.length > 0) matched = filtered;
            }
            const r0   = matched[0];
            const row  = r0 ? {
                ver:   String(r0[1] ?? '').trim(),
                title: String(r0[2] ?? '').trim(),
                diff:  String(r0[3] ?? '').trim(),
                lv:    String(r0[4] ?? '').trim(),
                note:  String(r0[8] ?? '').trim(),
            } : null;

                // Store difficulty for submitVote()
                window._voteTitle      = row ? row.title : title;
                window._voteDifficulty = row ? (row.diff || '') : '';

                if (!row) {
                    main.innerHTML = `<p class="not-found">"${title}" not found. <a href="table.html" style="color:rgba(255,255,255,0.6)">Back to Table</a></p>`;
                    return;
                }

                // 곡 정보 테이블 렌더링
                main.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Diff.</th>
                                <th>Lv</th>
                                <th>Lv.x</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${row.title || ''}</td>
                                <td>${row.diff  || ''}</td>
                                <td>${row.lv    || ''}</td>
                                <td>${getLvx(row.title || '', row.diff || '')}</td>
                            </tr>
                        </tbody>
                    </table>

                    <table id="option-table" style="margin-top: 10px;">
                        <tbody>
                            <tr>
                                <th style="width:1%; white-space:nowrap; text-align:center;">Option</th>
                                <td id="option-cell" style="text-align:left; line-height:1.8;"></td>
                            </tr>
                            <tr>
                                <th style="width:1%; white-space:nowrap; text-align:center;">Note</th>
                                <td id="note-cell" style="text-align:left;"></td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="vote-form">
                        <h2>Vote</h2>

                        <div class="vote-row">
                            <span class="vote-label">FLIP</span>
                            <select id="opt1" class="vote-select" onchange="updateSelectColor(this)">
                                <option value="OFF">OFF</option>
                                <option value="FLIP">FLIP</option>
                            </select>
                        </div>

                        <div class="vote-row">
                            <span class="vote-label">1P(LEFT)</span>
                            <select id="opt2" class="vote-select" onchange="updateSelectColor(this)">
                                <option value="OFF">OFF</option>
                                <option value="MIRROR">MIRROR</option>
                                <option value="RANDOM">RANDOM</option>
                                <option value="R-RANDOM">R-RANDOM</option>
                                <option value="S-RANDOM">S-RANDOM</option>
                            </select>
                        </div>

                        <div class="vote-row">
                            <span class="vote-label">2P(RIGHT)</span>
                            <select id="opt3" class="vote-select" onchange="updateSelectColor(this)">
                                <option value="OFF">OFF</option>
                                <option value="MIRROR">MIRROR</option>
                                <option value="RANDOM">RANDOM</option>
                                <option value="R-RANDOM">R-RANDOM</option>
                                <option value="S-RANDOM">S-RANDOM</option>
                            </select>
                        </div>

                        <div class="vote-row" style="align-items:flex-start; margin-top:8px;">
                            <span class="vote-label" style="padding-top:8px;">Note</span>
                            <div style="flex:1; max-width:500px;">
                                <textarea id="voteNote" class="vote-textarea" maxlength="100" placeholder="Comment here"
                                    oninput="updateByteCount(this)"></textarea>
                                <div id="byteCount" style="font-size:9pt; color:rgba(255,255,255,0.3); text-align:right; margin-top:4px;">0 / 100 bytes</div>
                            </div>
                        </div>

                    <div style="margin: 16px auto 0; max-width: 500px; margin-left: auto; margin-right: auto; padding: 10px 14px; background-color: rgba(255,200,50,0.08); border: 1px solid rgba(255,200,50,0.25); border-radius: 4px; font-size: 8.5pt; line-height: 1.75; color: rgba(255,255,255,0.55);">
                        <div>Votes are not applied immediately and may take 3–7 days to reflect. Once submitted, a vote cannot be cancelled and comments cannot be edited.</div>
                        <div style="margin-top:6px;">투표는 즉시 적용되지 않으며, 반영에 3-7일 정도 소요됩니다. 한 번 투표된 데이터는 취소할 수 없으며, 코멘트 수정 또한 불가능합니다.</div>
                        <div style="margin-top:6px;">投票はすぐに反映されず、反映まで3〜7日ほどかかります。一度投票したデータはキャンセルできず、コメントの修正も不可能です。</div>
                    </div>
                        <button class="submit-btn" id="submitBtn" onclick="submitVote()">Submit</button>
                        <div class="result-msg" id="resultMsg"></div>
                    </div>
                `;

                // Initialize select colors
                ['opt1','opt2','opt3'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) updateSelectColor(el);
                });
                const noteCell = document.getElementById('note-cell');
                if (noteCell) {
                    noteCell.innerHTML = '';
                    const _comments = (window._voteNoteMap || {})[`${row.title}|${row.diff}`] || [];
                    if (_comments.length === 0) {
                        noteCell.style.color = 'rgba(255,255,255,0.35)';
                        noteCell.textContent = '-';
                    } else {
                        _comments.forEach(c => {
                            const _line = document.createElement('div');
                            _line.style.cssText = 'margin-bottom:4px; font-size:9.5pt; line-height:1.6;';
                            const _label = document.createElement('span');
                            const _parts = [];
                            if (c.opt1 !== 'OFF') _parts.push(c.opt1);
                            _parts.push(`${c.opt2}/${c.opt3}`);
                            _label.textContent = `[${_parts.join(', ')}] `;
                            _label.style.color = 'rgba(255,255,255,0.4)';
                            const _text = document.createElement('span');
                            _text.textContent = `${c.note} (${c.uid[0]}***)`;
                            _text.style.color = 'rgba(255,255,255,0.75)';
                            _line.appendChild(_label);
                            _line.appendChild(_text);
                            noteCell.appendChild(_line);
                        });
                    }
                }
                const optCell = document.getElementById('option-cell');
                const distrib = optionDistrib[`${row.title}|${row.diff}`] || [];
                if (distrib.length === 0) {
                    optCell.style.color = '#666'; optCell.textContent = '-';
                } else {
                    distrib.forEach((d, i) => {
                        const line = document.createElement('div');
                        const prefix = document.createElement('span');
                        prefix.textContent = `[${i + 1}] `;
                        prefix.style.color = 'rgba(255,255,255,0.4)';
                        line.appendChild(prefix);
                        line.appendChild(makeOptionSpan(d.opt1, d.opt2, d.opt3));
                        const pct = document.createElement('span');
                        pct.textContent = ` (${d.pct}%)`;
                        pct.style.color = 'rgba(255,255,255,0.35)';
                        line.appendChild(pct);
                        optCell.appendChild(line);
                    });
                }
        })
        .catch(err => {
                console.error('Data load failed:', err);
                main.innerHTML = '<p class="not-found">Failed to load data.</p>';
            });
    }

    function updateSelectColor(el) {
        const val = el.value;
        if (val === 'OFF')                          el.style.color = '#808080';
        else if (val === 'MIRROR')                  el.style.color = 'rgba(150,220,150,1)';
        else if (val === 'RANDOM' || val === 'R-RANDOM') el.style.color = '#FFA500';
        else if (val === 'S-RANDOM')                el.style.color = 'rgba(255,60,60,0.75)';
        else                                        el.style.color = 'white';
    }

    function updateByteCount(el) {
        const bytes = new TextEncoder().encode(el.value).length;
        const display = document.getElementById('byteCount');
        if (display) {
            display.textContent = `${bytes} / 100 bytes`;
            display.style.color = bytes >= 90 ? 'rgba(255,160,80,0.8)' : 'rgba(255,255,255,0.3)';
        }
        // Trim if over 100 bytes
        if (bytes > 100) {
            let trimmed = el.value;
            while (new TextEncoder().encode(trimmed).length > 100) {
                trimmed = trimmed.slice(0, -1);
            }
            el.value = trimmed;
            updateByteCount(el);
        }
    }

    function submitVote() {
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('resultMsg');

        // Record submission time (KST)
        const now = new Date();
        const timestamp = now.toLocaleString('ko-KR', {
            timeZone: 'Asia/Seoul',
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: false
        });

        const noteEl = document.getElementById('voteNote');
        const noteVal = noteEl ? noteEl.value.trim() : '';

        const _sess = (typeof checkSession === 'function') ? checkSession() : null;

        const payload = {
            action:     'vote',
            timestamp:  timestamp,
            title:      window._voteTitle      ?? title,
            difficulty: window._voteDifficulty ?? '',
            option1:    document.getElementById('opt1').value,
            option2:    document.getElementById('opt2').value,
            option3:    document.getElementById('opt3').value,
            note:       noteVal,
            id:         _sess ? _sess.id : '',
        };

        btn.disabled = true;
        btn.textContent = 'Sending...';
        msg.style.display = 'none';

        const query = new URLSearchParams(payload).toString();

        fetch(`${APPS_SCRIPT_URL}?${query}`, { method: 'GET' })
        .then(res => res.json())
        .then(result => {
            if (result.status === 'success') {
                msg.textContent = 'Vote submitted successfully!';
                msg.className = 'result-msg success';
                msg.style.display = 'block';
                btn.textContent = 'Done';

                
            } else {
                throw new Error(result.message || 'unknown error');
            }
        })
        .catch(err => {
            console.error('Submission failed:', err);
            msg.textContent = 'Submission failed. Please try again.';
            msg.className = 'result-msg error';
            msg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Submit';
        });
    }
</script>


    <footer id="site-footer"></footer>
</body>
</html>
